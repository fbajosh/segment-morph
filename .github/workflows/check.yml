name: Static checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: npm run check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile geometry modules
        run: python -m compileall -q public/py
